[project]
name = "linkedin-actions-mcp"
version = "0.1.0"
description = "MCP local e controlado para publicar conteúdo e auxiliar candidaturas no LinkedIn."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Leandro Jacome" }]
dependencies = [
  "fastmcp>=3.4.7,<4",
  "httpx>=0.28.1,<1",
  "patchright>=1.55.0,<2",
  "pydantic>=2.12.0,<3",
  "pydantic-settings>=2.12.0,<3",
]

[dependency-groups]
dev = [
  "pip-audit>=2.9.0,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2.0,<2",
  "ruff>=0.14.0,<1",
]

[project.scripts]
linkedin-actions-mcp = "linkedin_actions_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_actions_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
